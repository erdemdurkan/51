<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0603">
<title>İskambil 51</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>">
<style>
  /* Oyun sabit 1920x1080 çerçevede çalışır; ekrana orantılı sığdırılır.
     Ultra geniş ekranda yanlar, dar ekranda alt-üst boş kalır (görüntü hep 1080p ile aynı). */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0603; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; border: 0; display: block;
    transform-origin: 50% 50%; background: #120a05; box-shadow: 0 0 60px rgba(0,0,0,.8); }
  /* telefon/küçük ekran: ölçekleme yok, oyun ekranı doldurur */
  #stage.fill { left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh; transform: none !important; box-shadow: none; }
</style>
</head>
<body>
<iframe id="stage" title="İskambil 51" allow="autoplay; fullscreen; clipboard-write"></iframe>
<script>
  const W = 1920;
  const H = 1080;
  const f = document.getElementById('stage');
  f.src = 'game.html' + location.search + location.hash;
  function fit() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const small = Math.min(vw, vh) < 600; // telefon: kendi duyarlı yerleşimini kullansın
    f.classList.toggle('fill', small);
    if (small) return;
    const s = Math.min(vw / W, vh / H);
    f.style.transform = `translate(-50%, -50%) scale(${s})`;
  }
  window.addEventListener('resize', fit);
  fit();
  // tıklayınca klavye/ses odağı oyuna geçsin
  window.addEventListener('pointerdown', () => f.contentWindow && f.contentWindow.focus());
  f.addEventListener('load', () => f.contentWindow.focus());
</script>
</body>
</html>
