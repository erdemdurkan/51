<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salon Önizleme</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e0805; overflow: hidden; font-family: Georgia, 'Times New Roman', serif; }
  canvas { display: block; }
  .vig { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 45%, rgba(10,4,0,.55) 80%, rgba(5,2,0,.85) 100%); }
  .grain { position: fixed; inset: 0; pointer-events: none; opacity: .07; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .tag { position: fixed; transform: translate(-50%, -100%); padding: 3px 12px 4px; border-radius: 4px;
    background: linear-gradient(#e9cf8f, #b98d45); color: #2a1606; font-weight: bold; font-size: 15px;
    box-shadow: 0 2px 6px rgba(0,0,0,.6); border: 1px solid #6b4a1c; white-space: nowrap; pointer-events: none; }
  .tag small { display: block; font-weight: normal; font-size: 11px; text-align: center; opacity: .8; }
  .tag.turn { box-shadow: 0 0 14px 3px rgba(255,190,90,.8); }
  .top { position: fixed; top: 12px; left: 16px; right: 16px; display: flex; justify-content: space-between; color: #e8d2a6; font-size: 14px; text-shadow: 0 1px 3px #000; pointer-events: none; }
  .badge { background: rgba(30,16,6,.75); border: 1px solid #7a5426; padding: 6px 12px; border-radius: 6px; }
  .hand { position: fixed; bottom: -26px; left: 50%; transform: translateX(-50%); display: flex; pointer-events: none; }
  .card { width: 78px; height: 112px; margin-left: -18px; border-radius: 7px; background: #fbf6ea; border: 1px solid #b9ab8e;
    box-shadow: -3px 2px 8px rgba(0,0,0,.55); font: bold 22px Georgia, serif; padding: 5px 7px; box-sizing: border-box; }
  .card.r { color: #b3261e; } .card.b { color: #1d1d1d; }
  @media (max-width: 700px) { .card { width: 48px; height: 70px; font-size: 14px; margin-left: -16px; } .tag { font-size: 12px; } }
</style>
</head>
<body>
<div class="vig"></div><div class="grain"></div>
<div class="top"><span class="badge">Önizleme · Salon ambiyansı (asıl oyun değişmedi)</span><span class="badge">Fareyi sürükle: bakış açısı</span></div>
<div class="hand" id="hand"></div>
<script src="vendor/three.min.js"></script>
<script>
(() => {
const T = THREE;
const V = (x, y, z) => new T.Vector3(x, y, z);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- renderer / sahne ----------
const renderer = new T.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = T.sRGBEncoding;
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene = new T.Scene();
scene.background = new T.Color(0x140b06);
scene.fog = new T.FogExp2(0x1e120a, 0.12);
const camera = new T.PerspectiveCamera(40, 1, 0.05, 60);
let camBase = V(0, 1.95, 2.95), camTarget = V(0, 0.95, -0.45);
if (location.search.includes('yakin')) { camBase = V(0.25, 1.4, 0.2); camTarget = V(0, 1.3, -1.4); }
if (location.search.includes('sol')) { camBase = V(-0.3, 1.4, 0.6); camTarget = V(-1.4, 1.3, 0); }

// ---------- dokular ----------
function canvasTex(w, h, draw, rx = 1, ry = 1) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new T.CanvasTexture(c); t.encoding = T.sRGBEncoding;
  t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(rx, ry); t.anisotropy = 8;
  return t;
}
function rnd(a) { let s = a; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function planks(base, vertical, rx, ry, seed = 7) {
  return canvasTex(512, 512, (g, w, h) => {
    const r = rnd(seed); const n = 8; const ph = h / n;
    for (let i = 0; i < n; i++) {
      const k = 0.75 + r() * 0.4; const c = new T.Color(base).multiplyScalar(k);
      g.fillStyle = '#' + c.getHexString(); g.fillRect(0, i * ph, w, ph);
      for (let j = 0; j < 40; j++) {
        g.strokeStyle = `rgba(0,0,0,${0.05 + r() * 0.12})`; g.lineWidth = 0.5 + r() * 1.5;
        const y = i * ph + r() * ph; g.beginPath(); g.moveTo(0, y);
        for (let x = 0; x <= w; x += 32) g.lineTo(x, y + Math.sin(x * 0.02 + j) * 2 * r());
        g.stroke();
      }
      g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, i * ph, w, 3);
      const cut = r() * w; g.fillRect(cut, i * ph, 3, ph);
      if (r() < 0.5) { g.fillStyle = 'rgba(30,15,5,.5)'; g.beginPath(); g.ellipse(r() * w, i * ph + ph / 2, 8, 4, 0, 0, 7); g.fill(); }
    }
  }, rx, ry);
}
const softTex = canvasTex(128, 128, (g, w) => {
  const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.4, 'rgba(255,255,255,.35)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, w);
});
const smokeTex = canvasTex(256, 256, (g, w) => {
  const r = rnd(3);
  for (let i = 0; i < 26; i++) {
    const x = w / 2 + (r() - 0.5) * w * 0.45, y = w / 2 + (r() - 0.5) * w * 0.45, rad = w * (0.12 + r() * 0.2);
    const gr = g.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, 'rgba(255,255,255,.22)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, w, w);
  }
});
const backTex = canvasTex(170, 240, (g, w, h) => {
  g.fillStyle = '#f4efe2'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#9e1f1f'; g.fillRect(10, 10, w - 20, h - 20);
  g.strokeStyle = 'rgba(255,230,200,.5)'; g.lineWidth = 2;
  for (let i = -h; i < w + h; i += 14) { g.beginPath(); g.moveTo(i, 10); g.lineTo(i + h, h); g.stroke(); g.beginPath(); g.moveTo(i, h - 10); g.lineTo(i + h, 0); g.stroke(); }
  g.strokeStyle = '#f4efe2'; g.lineWidth = 3; g.strokeRect(18, 18, w - 36, h - 36);
});
function faceTex(rank, suit, red) {
  return canvasTex(170, 240, (g, w, h) => {
    g.fillStyle = '#faf5e8'; g.fillRect(0, 0, w, h);
    g.fillStyle = red ? '#b3261e' : '#1d1d1d'; g.font = 'bold 44px Georgia'; g.fillText(rank, 12, 50);
    g.font = '40px Georgia'; g.fillText(suit, 14, 92); g.font = '96px Georgia'; g.fillText(suit, 50, 185);
  });
}

// ---------- malzeme yardımcıları ----------
const std = (color, rough = 0.8, extra = {}) => new T.MeshStandardMaterial({ color, roughness: rough, metalness: 0, ...extra });
const shadowAll = (o) => o.traverse((m) => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } });
function limbMesh(r, mat) {
  const m = new T.Mesh(new T.CylinderGeometry(r, r * 0.92, 1, 14), mat);
  m.userData.set = (a, b) => {
    const len = a.distanceTo(b); m.position.copy(a).add(b).multiplyScalar(0.5);
    m.scale.set(1, len, 1); m.quaternion.setFromUnitVectors(V(0, 1, 0), b.clone().sub(a).normalize());
  };
  return m;
}
function ball(r, mat, p) { const m = new T.Mesh(new T.SphereGeometry(r, 18, 14), mat); if (p) m.position.copy(p); return m; }

// ---------- oda ----------
const floorM = std(0xffffff, 0.75, { map: planks('#6b4426', false, 6, 6, 11) });
const floor = new T.Mesh(new T.PlaneGeometry(10, 10), floorM);
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const wallM = std(0xffffff, 0.85, { map: planks('#4a2c18', true, 3, 2, 5) });
wallM.map.rotation = Math.PI / 2;
function wall(w, h, x, z, ry) { const m = new T.Mesh(new T.PlaneGeometry(w, h), wallM); m.position.set(x, h / 2, z); m.rotation.y = ry; m.receiveShadow = true; scene.add(m); return m; }
wall(9, 3.4, 0, -4.2, 0); wall(9, 3.4, -4, 0, Math.PI / 2); wall(9, 3.4, 4, 0, -Math.PI / 2);
const ceil = new T.Mesh(new T.PlaneGeometry(9, 9), std(0x2a180c, 0.9)); ceil.position.y = 3.4; ceil.rotation.x = Math.PI / 2; scene.add(ceil);
const beamM = std(0x2e1a0c, 0.8);
for (let i = -3; i <= 3; i++) { const b = new T.Mesh(new T.BoxGeometry(9, 0.18, 0.2), beamM); b.position.set(0, 3.3, i * 1.3); scene.add(b); }
// lambri
const wainM = std(0x3a2010, 0.7);
[[0, -4.18, 0, 9], [-3.98, 0, Math.PI / 2, 9], [3.98, 0, -Math.PI / 2, 9]].forEach(([x, z, ry, w]) => {
  const m = new T.Mesh(new T.BoxGeometry(w, 0.06, 0.06), wainM); m.position.set(x, 1.0, z); m.rotation.y = ry; scene.add(m);
});
// direkler
[[-2.3, -1.9], [2.5, -1.7]].forEach(([x, z]) => {
  const p = new T.Mesh(new T.BoxGeometry(0.24, 3.4, 0.24), std(0x3b2312, 0.7)); p.position.set(x, 1.7, z); shadowAll(p); scene.add(p);
});
// çerçeveler
[[-2.9, 1.9, 0x3a3020], [3.0, 1.95, 0x2a3328]].forEach(([x, y, c]) => {
  const f = new T.Mesh(new T.BoxGeometry(0.7, 0.55, 0.04), std(0x1c1008, 0.5)); f.position.set(x, y, -4.17); scene.add(f);
  const pc = new T.Mesh(new T.PlaneGeometry(0.58, 0.43), std(c, 0.9)); pc.position.set(x, y, -4.14); scene.add(pc);
});

// pencere + ışık hüzmesi
const winC = new T.Mesh(new T.PlaneGeometry(1.0, 1.5), new T.MeshBasicMaterial({ color: 0xd8e2ff }));
winC.position.set(-3.97, 1.85, -1.4); winC.rotation.y = Math.PI / 2; scene.add(winC);
const frameM = std(0x24150a, 0.6);
[[0, 0.75, 1.1, 0.06], [0, -0.75, 1.1, 0.06], [0, 0, 0.05, 1.55], [0.52, 0, 0.06, 1.55], [-0.52, 0, 0.06, 1.55], [0, 0.25, 1.05, 0.04]].forEach(([dz, dy, w, h]) => {
  const b = new T.Mesh(new T.BoxGeometry(0.06, h, w), frameM); b.position.set(-3.95, 1.85 + dy, -1.4 + dz); scene.add(b);
});
const shaftTex = canvasTex(64, 256, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.6, 'rgba(255,255,255,.5)'); gr.addColorStop(1, 'rgba(255,255,255,1)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  const gx = g.createLinearGradient(0, 0, w, 0); gx.addColorStop(0, 'rgba(0,0,0,1)'); gx.addColorStop(0.5, 'rgba(0,0,0,0)'); gx.addColorStop(1, 'rgba(0,0,0,1)');
  g.globalCompositeOperation = 'destination-out'; g.fillStyle = gx; g.fillRect(0, 0, w, h);
});
const shaftM = new T.MeshBasicMaterial({ color: 0xbfcfff, map: shaftTex, transparent: true, opacity: 0.16, blending: T.AdditiveBlending, depthWrite: false, side: T.DoubleSide, fog: false });
const winP = V(-3.9, 1.85, -1.4), floorP = V(-1.2, 0, -0.6);
for (let i = 0; i < 3; i++) {
  const len = winP.distanceTo(floorP);
  const sh = new T.Mesh(new T.CylinderGeometry(0.75 + i * 0.12, 0.55, len, 4, 1, true), shaftM);
  sh.position.copy(winP).add(floorP).multiplyScalar(0.5);
  sh.quaternion.setFromUnitVectors(V(0, 1, 0), floorP.clone().sub(winP).normalize());
  sh.rotateY(Math.PI / 4 + i * 0.3); scene.add(sh);
}
const sun = new T.DirectionalLight(0xbfd0ff, 0.55); sun.position.set(-6, 3.2, -2); sun.target.position.copy(floorP); scene.add(sun, sun.target);

// bar
const bar = new T.Group(); scene.add(bar);
const counter = new T.Mesh(new T.BoxGeometry(5, 1.1, 0.6), std(0xffffff, 0.6, { map: planks('#4f2f17', true, 2, 1, 21) }));
counter.position.set(0.6, 0.55, -3.3); bar.add(counter);
const ctop = new T.Mesh(new T.BoxGeometry(5.1, 0.06, 0.72), std(0x5e3a1c, 0.35)); ctop.position.set(0.6, 1.12, -3.3); bar.add(ctop);
const mirror = new T.Mesh(new T.PlaneGeometry(3.2, 1.4), std(0x2a2620, 0.15, { metalness: 0.8 })); mirror.position.set(0.6, 2.0, -4.15); bar.add(mirror);
const bottleCols = [0x8a4a12, 0x3c5a20, 0x6a2a10, 0xa86a1a, 0x2c3a2a, 0x7a5a2a];
const br = rnd(99);
[1.45, 1.95, 2.45].forEach((y) => {
  const sh = new T.Mesh(new T.BoxGeometry(3.6, 0.04, 0.24), std(0x3a2210, 0.6)); sh.position.set(0.6, y, -4.05); bar.add(sh);
  for (let x = -1.1; x < 2.3; x += 0.13 + br() * 0.08) {
    const c = bottleCols[Math.floor(br() * bottleCols.length)];
    const m = std(c, 0.12, { transparent: true, opacity: 0.88, emissive: c, emissiveIntensity: 0.25 });
    const h = 0.22 + br() * 0.14;
    const b = new T.Mesh(new T.CylinderGeometry(0.035, 0.038, h, 12), m); b.position.set(x, y + 0.02 + h / 2, -4.03); bar.add(b);
    const n = new T.Mesh(new T.CylinderGeometry(0.012, 0.03, 0.09, 10), m); n.position.set(x, y + 0.02 + h + 0.045, -4.03); bar.add(n);
  }
});

// ---------- lambalar ----------
const lamps = [];
function lamp(p, intensity, dist, shadow) {
  const L = new T.PointLight(0xff9c52, intensity, dist, 2);
  L.position.copy(p);
  if (shadow) { L.castShadow = true; L.shadow.mapSize.set(1024, 1024); L.shadow.bias = -0.002; L.shadow.radius = 4; }
  scene.add(L);
  const glow = new T.Sprite(new T.SpriteMaterial({ map: softTex, color: 0xffb060, transparent: true, blending: T.AdditiveBlending, depthWrite: false, fog: false }));
  glow.scale.setScalar(0.55); glow.position.copy(p); scene.add(glow);
  const flame = ball(0.03, new T.MeshBasicMaterial({ color: 0xffe0a0 }), p); scene.add(flame);
  const glass = new T.Mesh(new T.SphereGeometry(0.085, 16, 12), new T.MeshStandardMaterial({ color: 0xffd8a0, roughness: 0.1, transparent: true, opacity: 0.35, emissive: 0xff9a40, emissiveIntensity: 0.6 }));
  glass.scale.y = 1.4; glass.position.copy(p); scene.add(glass);
  lamps.push({ L, glow, base: intensity, ph: Math.random() * 10 });
  return L;
}
// masa üstü asma lamba
const hang = V(0, 2.25, -0.1);
const cord = new T.Mesh(new T.CylinderGeometry(0.008, 0.008, 1.1, 6), std(0x111111)); cord.position.set(0, 2.85, -0.1); scene.add(cord);
const shade = new T.Mesh(new T.ConeGeometry(0.32, 0.18, 32, 1, true), std(0x2a3a2a, 0.5, { metalness: 0.4, side: T.DoubleSide })); shade.position.set(0, 2.38, -0.1); scene.add(shade);
lamp(hang, 1.9, 6, true);
[V(-3.85, 2.1, -3.0), V(3.85, 2.1, -2.6), V(-2.3, 2.15, -1.73), V(2.5, 2.15, -1.53), V(-1.0, 2.4, -3.9), V(2.2, 2.4, -3.9), V(3.85, 2.1, 1.2)].forEach((p) => lamp(p, 0.8, 3.8, false));
scene.add(new T.HemisphereLight(0x5a3a24, 0x0a0502, 0.22));

// ---------- masa ----------
const table = new T.Group(); scene.add(table);
const top = new T.Mesh(new T.CylinderGeometry(1.08, 1.08, 0.07, 64), std(0xffffff, 0.55, { map: planks('#7a4e2a', false, 2, 2, 33) }));
top.position.y = 0.74; table.add(top);
const edge = new T.Mesh(new T.TorusGeometry(1.08, 0.03, 10, 64), std(0x4a2a12, 0.5)); edge.rotation.x = Math.PI / 2; edge.position.y = 0.74; table.add(edge);
const ped = new T.Mesh(new T.CylinderGeometry(0.1, 0.14, 0.7, 16), std(0x3a2210, 0.6)); ped.position.y = 0.36; table.add(ped);
const foot = new T.Mesh(new T.CylinderGeometry(0.5, 0.55, 0.06, 24), std(0x3a2210, 0.6)); foot.position.y = 0.03; table.add(foot);
shadowAll(table);
const TY = 0.775;
// deste, atılan kart, paralar, bardaklar
const cardBox = new T.BoxGeometry(0.17, 0.004, 0.24);
const white = std(0xf6f2e6, 0.7);
const backM = std(0xffffff, 0.6, { map: backTex });
const deck = new T.Mesh(new T.BoxGeometry(0.17, 0.07, 0.24), [white, white, backM, white, white, white]); deck.position.set(-0.12, TY + 0.035, -0.05); deck.rotation.y = 0.08; deck.castShadow = true; table.add(deck);
const discard = new T.Group(); discard.position.set(0.22, TY, -0.02); table.add(discard);
function faceCard(rank, suit, red) { return new T.Mesh(cardBox, [white, white, std(0xffffff, 0.6, { map: faceTex(rank, suit, red) }), backM, white, white]); }
const d0 = faceCard('7', '♥', true); d0.rotation.y = -0.2; d0.position.y = 0.003; discard.add(d0);
const gold = std(0xd8a84a, 0.3, { metalness: 0.9 }), silver = std(0xc8c8c8, 0.3, { metalness: 0.9 });
const coinGeo = new T.CylinderGeometry(0.028, 0.028, 0.007, 20);
[[0.5, 0.45, 6, gold], [0.58, 0.38, 3, silver], [-0.55, 0.35, 5, silver], [-0.48, 0.45, 2, gold], [0.1, -0.62, 7, gold], [-0.05, -0.6, 4, silver], [0.62, -0.1, 4, gold], [-0.6, -0.15, 5, gold]].forEach(([x, z, n, m]) => {
  for (let i = 0; i < n; i++) { const c = new T.Mesh(coinGeo, m); c.position.set(x + (Math.random() - 0.5) * 0.006, TY + 0.004 + i * 0.007, z + (Math.random() - 0.5) * 0.006); c.castShadow = true; table.add(c); }
});
const scattered = [[0.35, 0.55], [-0.35, 0.6], [0.7, 0.2]];
scattered.forEach(([x, z]) => { const c = new T.Mesh(coinGeo, Math.random() < 0.5 ? gold : silver); c.position.set(x, TY + 0.004, z); table.add(c); });
function glass(x, z) {
  const g = new T.Group();
  const gl = new T.Mesh(new T.CylinderGeometry(0.038, 0.032, 0.1, 20, 1, true), new T.MeshStandardMaterial({ color: 0xffffff, roughness: 0.05, transparent: true, opacity: 0.25, side: T.DoubleSide }));
  gl.position.y = 0.05;
  const bottom = new T.Mesh(new T.CylinderGeometry(0.032, 0.032, 0.012, 20), new T.MeshStandardMaterial({ color: 0xffffff, roughness: 0.05, transparent: true, opacity: 0.4 })); bottom.position.y = 0.006;
  const liq = new T.Mesh(new T.CylinderGeometry(0.034, 0.032, 0.045, 20), new T.MeshStandardMaterial({ color: 0xb8661a, roughness: 0.1, transparent: true, opacity: 0.85, emissive: 0x5a2a05, emissiveIntensity: 0.4 }));
  liq.position.y = 0.034;
  g.add(gl, bottom, liq); g.position.set(x, TY, z); table.add(g); return g;
}
glass(-0.55, -0.6); glass(0.62, -0.55); glass(0.72, 0.5); glass(-0.4, 0.75);
// kül tablası
const ash = new T.Mesh(new T.CylinderGeometry(0.07, 0.06, 0.03, 20), std(0x3a3a3a, 0.4, { metalness: 0.5 })); ash.position.set(0.3, TY + 0.015, -0.6); table.add(ash);

// ---------- karakter ----------
function build(o) {
  const skin = std(o.skin, 0.62), skinD = std(new T.Color(o.skin).multiplyScalar(0.82), 0.7);
  const shirt = std(o.shirt, 0.85), vest = std(o.vest, 0.75, { side: T.DoubleSide }), pants = std(o.pants, 0.9);
  const hairM = std(o.hair, 0.95), hatM = std(o.hatC, 0.9), dark = std(0x1a0f08, 0.5);
  const F = o.female;
  const root = new T.Group();
  // sandalye
  const wood = std(0x3e2412, 0.6);
  const seat = new T.Mesh(new T.BoxGeometry(0.46, 0.05, 0.44), wood); seat.position.y = 0.45; root.add(seat);
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([x, z]) => { const l = new T.Mesh(new T.CylinderGeometry(0.022, 0.018, 0.45, 8), wood); l.position.set(x * 0.2, 0.225, z * 0.19); root.add(l); });
  [-1, 1].forEach((x) => { const p = new T.Mesh(new T.CylinderGeometry(0.022, 0.022, 0.55, 8), wood); p.position.set(x * 0.2, 0.75, -0.21); root.add(p); });
  [0.7, 0.85, 0.98].forEach((y) => { const s = new T.Mesh(new T.BoxGeometry(0.42, 0.05, 0.025), wood); s.position.set(0, y, -0.21); root.add(s); });
  // bacaklar ve çizmeler

// ---------- animasyon ----------
const clock = new T.Clock();
let lastPuff = 0;
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime, now = t * 1000;
  yaw += (tyaw - yaw) * 0.08; pitch += (tpitch - pitch) * 0.08;
  const drift = reduce ? 0 : Math.sin(t * 0.15) * 0.04;
  const off = camBase.clone().sub(camTarget);
  off.applyAxisAngle(V(0, 1, 0), yaw + drift);
  const right = V(1, 0, 0).applyAxisAngle(V(0, 1, 0), yaw + drift);
  off.applyAxisAngle(right, -pitch);
  camera.position.copy(camTarget).add(off); camera.lookAt(camTarget);

  // sıra
  if (t - turnStart > 4.2) { turnStart = t; turn = (turn + 1) % (players.length + 1); }
  const tt = t - turnStart;

  lamps.forEach((l) => { const fl = reduce ? 1 : 0.9 + Math.sin(t * 7 + l.ph) * 0.04 + Math.sin(t * 13.7 + l.ph * 2) * 0.03 + (Math.random() - 0.5) * 0.04; l.L.intensity = l.base * fl; l.glow.material.opacity = 0.7 * fl; });

  seats.forEach((s) => {
    const f = s.f, ph = s.phase;
    const myTurn = players[turn] === s;
    const br = reduce ? 0 : Math.sin(t * 1.6 + ph);
    f.torso.scale.set(1 + 0.008 * br, 1 + 0.012 * br, 1 + 0.008 * br);
    s.lean += ((myTurn ? 0.1 : 0) - s.lean) * 0.06;
    f.torso.rotation.x = s.lean;
    // bakışlar: arada bir başka oyuncuya bakar
    if (t > s.glanceT) { s.glanceT = t + 2 + Math.random() * 4; s.glance = myTurn ? 0 : (Math.random() - 0.5) * 1.1; }
    const hy = (s.p.extra ? Math.sin(t * 0.3 + ph) * 0.4 : s.glance) + (reduce ? 0 : Math.sin(t * 0.7 + ph) * 0.05);
    f.head.rotation.y += (hy - f.head.rotation.y) * 0.05;
    f.head.rotation.x = (myTurn ? 0.16 : 0.04) + (reduce ? 0 : Math.sin(t * 0.5 + ph) * 0.04);
    f.head.rotation.z = Math.sin(t * 0.4 + ph) * 0.03;
    f.eyes.forEach((e) => { e.rotation.y = -f.head.rotation.y * 0.35; });
    if (!reduce && now > s.nextBlink) { s.blinkUntil = now + 120; s.nextBlink = now + 2000 + Math.random() * 4500; }
    f.eyes.forEach((e) => { e.scale.y = now < s.blinkUntil ? 0.12 : 1; });
    // eller
    const sway = reduce ? 0 : Math.sin(t * 0.9 + ph) * 0.01;
    let reachK = 0;
    if (myTurn) { reachK = tt > 1.6 && tt < 2.6 ? Math.sin(((tt - 1.6) / 1.0) * Math.PI) : 0; if (tt > 2.05 && !s.thrown) { s.thrown = true; throwCard(s); } }
    else s.thrown = false;
    const hl = V(-0.075, 0.98 + sway, 0.31), hr = V(0.075, 0.98 - sway, 0.31);
    if (s.p.extra) { hl.set(-0.12, 1.05, 0.3); hr.set(0.18, 1.12, 0.32); }
    hr.lerp(V(0.12, 0.86, 0.62), reachK);
    poseArms(f, [hl, hr]);
    f.fan.position.set(-0.0 + sway, 0.99, 0.32);
    f.fan.rotation.set(-0.45, 0, Math.sin(t * 0.8 + ph) * 0.03);
    if (s.tag) {
      const v = V(0, 1.62, 0); f.root.localToWorld(v); v.project(camera);
      s.tag.style.left = ((v.x + 1) / 2) * innerWidth + 'px'; s.tag.style.top = ((1 - v.y) / 2) * innerHeight + 'px';
      s.tag.classList.toggle('turn', myTurn);
    }
    if (s.cig) {
      const k = 0.6 + 0.4 * Math.max(0, Math.sin(t * 0.8));
      s.cig.tipGlow.material.opacity = k; s.cig.tipGlow.scale.setScalar(0.03 + k * 0.03);
      if (t - lastPuff > 0.22 && !reduce) { lastPuff = t; const p = new T.Vector3(); s.cig.tip.getWorldPosition(p); puff(p); }
    }
  });

  flying.forEach((fl) => {
    fl.t = Math.min(1, fl.t + dt * 1.8);
    const k = fl.t * fl.t * (3 - 2 * fl.t);
    fl.c.position.lerpVectors(fl.from, fl.to, k); fl.c.position.y += Math.sin(k * Math.PI) * 0.15;
    fl.c.rotation.set(0, fl.rot * k + k * 2.4, 0);
    if (fl.t >= 1 && !fl.done) { fl.done = true; scene.remove(fl.c); discard.add(fl.c); fl.c.position.set(0, 0.004 + discard.children.length * 0.004, 0); fl.c.rotation.y = fl.rot; if (discard.children.length > 6) discard.remove(discard.children[1]); }
  });
  for (let i = flying.length - 1; i >= 0; i--) if (flying[i].done) flying.splice(i, 1);

  smoke.forEach((m) => { if (reduce) return; m.position.addScaledVector(m.userData.v, dt); m.material.rotation += m.userData.rot * dt; if (m.position.y > 3.3) m.position.y = 1.5; if (Math.abs(m.position.x) > 3.8) m.userData.v.x *= -1; });
  for (let i = puffs.length - 1; i >= 0; i--) {
    const m = puffs[i], u = m.userData; u.age += dt;
    m.position.addScaledVector(u.v, dt); u.v.x += Math.sin(t * 2 + i) * 0.002;
    m.scale.setScalar(0.04 + u.age * 0.12); m.material.opacity = 0.35 * (1 - u.age / u.life); m.material.rotation += dt * 0.3;
    if (u.age > u.life) { scene.remove(m); m.material.dispose(); puffs.splice(i, 1); }
  }
  if (!reduce) { const a = dustG.attributes.position; for (let i = 0; i < dustN; i++) { a.array[i * 3 + 1] += Math.sin(t * 0.5 + i) * 0.0006; a.array[i * 3] += Math.cos(t * 0.3 + i * 1.3) * 0.0005; } a.needsUpdate = true; }
  renderer.render(scene, camera);
}
frame();
})();
</script>
